name: SmartBite SDET CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  full-stack-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # 🚨 NEW: Spin up a temporary MongoDB database in the cloud!
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📦 Install Backend Dependencies
      working-directory: ./backend
      run: npm install

    - name: 🚀 Start Backend Server
      working-directory: ./backend
      # Create a test .env file on the fly and start the server in the background (&)
      run: |
        echo "MONGO_URI=mongodb://127.0.0.1:27017/smartbite_test" > .env
        echo "PORT=5000" >> .env
        node server.js &
        sleep 5 

    - name: 📦 Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: 🎭 Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: 🧪 Run All Playwright Tests (UI + API)
      working-directory: ./frontend
      # Running this without a specific file name executes BOTH recipe.spec.js and api.spec.js
      run: npx playwright test